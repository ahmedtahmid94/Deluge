<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Beach Day</title>
<meta name="viewport" content="width=device-width, initial-scale=1"></head><body><main>
<h1>Beach Day</h1>
<label for="beach">Beach</label>
<select id="beach"><option value="south-beach">South Beach</option><option value="haulover">Haulover</option></select>
<p role="status" id="verdict">Loading…</p>
<p id="updated"></p>
</main><script>
async function load() {
  const v = document.getElementById("verdict");
  try {
    const res = await fetch("/api/forecast?beach=" + document.getElementById("beach").value);
    if (!res.ok) throw new Error();
    const d = await res.json();
    v.textContent = `${d.beach}: ${d.verdict} — best ${d.window}`;
    document.getElementById("updated").textContent = "Updated " + new Date(d.generatedAt).toLocaleTimeString("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "2-digit" });
  } catch { v.textContent = "Couldn't load the forecast. Try again."; }
}
document.getElementById("beach").addEventListener("change", load); load();
</script></body></html>
